tool: ligandmpnn
group: design
image: ovo-ligandmpnn:latest
gpu: true
description: LigandMPNN container used as shared sequence-design backend for RFdiffusion and compatible PDB candidates.
inputs:
  candidates_jsonl:
    type: normalized_candidates
    required: true
params:
  model_type:
    type: enum
    default: protein_mpnn
    choices: [protein_mpnn, ligand_mpnn, soluble_mpnn]
  design_chains:
    type: chain_list
    required: false
  num_seq_per_target:
    type: integer
    default: 1
  sampling_temp:
    type: float
    default: 0.0001
  omit_AAs:
    type: string
    default: CX
outputs:
  sequences:
    path: artifacts/raw/ligandmpnn/output/**/seqs/*.fa
    type: fasta
  backbones:
    path: artifacts/raw/ligandmpnn/output/**/backbones/*.pdb
    type: pdb
  candidates:
    path: artifacts/normalized_candidates/candidates.jsonl
    type: normalized_candidates
